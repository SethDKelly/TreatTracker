name: Deploy to dev

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-2
  TF_DIR: infra

jobs:
  deploy-dev:
    name: Deploy (dev)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::521018312783:role/dev-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Build Lambda package
        working-directory: backend
        run: |
          npm ci
          npm run package

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform init / apply
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
          TF_VAR_hosted_zone_id: ${{ vars.HOSTED_ZONE_ID }}
        run: |
          terraform init -input=false
          terraform apply -auto-approve -input=false

      - name: Update Lambda code
        working-directory: ${{ env.TF_DIR }}
        run: |
          FUNCTION_NAME="$(terraform output -raw lambda_function_name)"
          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --zip-file "fileb://../backend/function.zip"
          aws lambda wait function-updated --function-name "$FUNCTION_NAME"

      - name: Read Terraform outputs
        id: tf
        working-directory: ${{ env.TF_DIR }}
        run: |
          {
            echo "api_url=$(terraform output -raw api_url)"
            echo "cognito_user_pool_id=$(terraform output -raw cognito_user_pool_id)"
            echo "cognito_client_id=$(terraform output -raw cognito_client_id)"
            echo "spa_bucket=$(terraform output -raw spa_bucket_name)"
            echo "cf_id=$(terraform output -raw cloudfront_distribution_id)"
            echo "app_url=$(terraform output -raw app_url)"
          } >> "$GITHUB_OUTPUT"

      - name: Build SPA
        working-directory: frontend
        env:
          VITE_API_URL: ${{ steps.tf.outputs.api_url }}
          VITE_COGNITO_USER_POOL_ID: ${{ steps.tf.outputs.cognito_user_pool_id }}
          VITE_COGNITO_CLIENT_ID: ${{ steps.tf.outputs.cognito_client_id }}
          VITE_COGNITO_REGION: ${{ env.AWS_REGION }}
        run: |
          npm ci
          npm run build

      - name: Sync SPA to S3
        run: |
          aws s3 sync frontend/dist "s3://${{ steps.tf.outputs.spa_bucket }}" --delete
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.tf.outputs.cf_id }}" \
            --paths "/*"

      - name: Summary
        run: |
          echo "App URL: ${{ steps.tf.outputs.app_url }}"
          echo "API URL: ${{ steps.tf.outputs.api_url }}"
